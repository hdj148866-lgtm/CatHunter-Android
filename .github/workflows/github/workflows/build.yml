
name: Build CatHunter APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CatHunter-Android-Build-Setup.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP file
        run: |
          ls -lh
          unzip -t CatHunter-Android-Build-Setup.zip
          
